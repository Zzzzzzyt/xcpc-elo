<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>排名预测 · XCPC ELO</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="layout">
      <header class="hero panel">
        <h1>排名预测</h1>
        <a
          class="github-link"
          href="https://github.com/Zzzzzzyt/xcpc-elo"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="View on GitHub"
        >
          <svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true">
            <path
              fill-rule="evenodd"
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 012.01-.27c.68 0 1.36.09 2.01.27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.19 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
            ></path>
          </svg>
          <span>GitHub Repo</span>
        </a>
        <p id="subtitle">正在加载数据...</p>
        <a class="page-link" href="./index.html">返回选手总览</a>
        <a class="page-link" href="./contests.html">比赛详情</a>
      </header>

      <section class="panel content-panel calculator-panel">
        <h2>概率计算器</h2>
        <p class="hint">没有完整报名表时，输入队伍总数和预测名次，直接得到各奖项概率。</p>
        <div class="calculator-form">
          <label>
            队伍总数
            <input id="calcTotal" type="number" min="2" step="1" inputmode="numeric" placeholder="例如 300" />
          </label>
          <label>
            预测名次
            <input id="calcRank" type="number" min="1" step="1" inputmode="numeric" placeholder="例如 15" />
          </label>
        </div>
        <div id="calcResult" class="statistic-grid calculator-result"></div>
      </section>

      <section class="panel content-panel">
        <div class="panel-head">
          <div class="controls">
            <label class="file-control">
              报名表 CSV
              <input id="csvInput" type="file" accept=".csv,text/csv" />
            </label>
          </div>
          <button id="downloadButton" type="button" style="margin-top: 23px" disabled>下载预测结果 CSV</button>
        </div>
        <div id="dropZone" class="drop-zone" role="button" tabindex="0">把报名表 CSV 拖到这里，或点击选择文件</div>
        <p id="status" class="hint">
          CSV 需包含学校列（school / university / 学校 / 院校 / organization）和至少一个队员列（teammate / 队员 / member）。
        </p>
        <div id="stats" class="statistic-grid"></div>
        <div class="table-wrap prediction-table">
          <table>
            <thead>
              <tr>
                <th title="名次颜色按 ICPC 奖牌规则：金牌前 10%，银牌前 30%，铜牌前 60%，名额向上取整">#</th>
                <th style="width: 24%">学校</th>
                <th style="width: 28%">队员</th>
                <th>命中</th>
                <th>评分</th>
                <th class="bucket" title="按拟合分布估计的进入前 10% 的概率">金</th>
                <th class="bucket" title="排名 10%-30% 的概率">银</th>
                <th class="bucket" title="排名 30%-60% 的概率">铜</th>
                <th class="bucket" title="排名 60%-100% 的概率">铁</th>
              </tr>
            </thead>
            <tbody id="predictionBody"></tbody>
          </table>
        </div>
        <div class="controls prediction-actions"></div>
        <p id="resultHint" class="hint"></p>
      </section>

      <footer class="panel footer-note">
        <p id="lawNote"></p>
      </footer>
    </main>

    <script src="./data.js"></script>
    <script src="./law.js"></script>
    <script src="./common.js"></script>
    <script src="./predict-core.js"></script>
    <script src="./predict.js"></script>
  </body>
</html>
