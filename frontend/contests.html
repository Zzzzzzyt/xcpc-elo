<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>比赛详情 · XCPC ELO</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="layout">
      <header class="hero panel">
        <h1>比赛详情</h1>
        <a
          class="github-link"
          href="https://github.com/Zzzzzzyt/xcpc-elo"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="View on GitHub"
        >
          <svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true">
            <path
              fill-rule="evenodd"
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 012.01-.27c.68 0 1.36.09 2.01.27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.19 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
            ></path>
          </svg>
          <span>GitHub Repo</span>
        </a>
        <p id="subtitle">正在加载数据...</p>
        <a class="page-link" href="./index.html">返回选手总览</a>
      </header>
      <section class="panel content-panel">
        <div class="contest-filters">
          <select id="seriesSelect" aria-label="筛选比赛系列">
            <option value="">全部系列</option>
          </select>
          <select id="yearSelect" aria-label="筛选年份">
            <option value="">全部年份</option>
          </select>
          <select id="contestSelect" aria-label="选择比赛"></select>
        </div>
        <div>
          <h2 id="contestTitle">选择比赛</h2>
          <p id="contestMeta" class="hint"></p>
        </div>
        <div id="contestStatistics" class="statistic-grid"></div>
        <div class="chart-wrap">
          <h3 class="chart-title">赛前排名预测误差分布</h3>
          <div id="predictionHistogram" aria-label="赛前排名预测误差直方图"></div>
        </div>
        <div class="chart-wrap">
          <h3 class="chart-title">赛后选手 rating 分布</h3>
          <div id="postContestRatingHistogram" aria-label="赛后选手 rating 分布直方图"></div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>预测排名Δ</th>
                <th>选手</th>
                <th>学校</th>
                <th>种子分</th>
                <th>赛前分</th>
                <th>表现分</th>
                <th>变化</th>
                <th>赛后分</th>
              </tr>
            </thead>
            <tbody id="contestParticipantsBody"></tbody>
          </table>
        </div>
        <p id="contestHint" class="hint"></p>
      </section>
    </main>
    <script src="./data.js"></script>
    <script src="./common.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@3.5.1/plotly.min.js"
      integrity="sha256-3y1u9/3WPP9LlwnQaIvfiGWzTmM0YznGabosLtdbL28="
      crossorigin="anonymous"
    ></script>
    <script src="./contests.js"></script>
  </body>
</html>
